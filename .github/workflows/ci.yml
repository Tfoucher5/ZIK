name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Railway attend ce workflow avant de déployer : les migrations passent avant le code
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx svelte-check --threshold error
      - run: npx vitest run --coverage
      # Couverture : comparée à la dernière mesure de develop (branche couverture)
      - name: Résumé de couverture
        run: |
          git fetch --depth=1 origin couverture 2>/dev/null             && git show FETCH_HEAD:coverage-summary.json > "$RUNNER_TEMP/base.json"             || rm -f "$RUNNER_TEMP/base.json"
          node scripts/couverture.mjs markdown coverage/coverage-summary.json             $( [ -s "$RUNNER_TEMP/base.json" ] && echo "$RUNNER_TEMP/base.json" )             > "$RUNNER_TEMP/couverture.md"
          cat "$RUNNER_TEMP/couverture.md" >> "$GITHUB_STEP_SUMMARY"
      # PR d'un fork ou de Dependabot : jeton en lecture seule, pas de commentaire
      - name: Commentaire de couverture sur la PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr comment ${{ github.event.pull_request.number }}
          --body-file "$RUNNER_TEMP/couverture.md" --edit-last --create-if-none
      - if: github.event_name == 'push' && github.ref_name == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/coverage-summary.json
      # config.js crée le client Supabase au chargement : valeurs factices, jamais appelées
      - run: npm run build
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ci
          SUPABASE_SERVICE_KEY: ci

  # Badge du README et mesure de référence des PR, sur une branche à part :
  # aucun service tiers. Un échec ici ne bloque ni les migrations ni Railway.
  couverture:
    needs: check
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    concurrency: couverture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: couverture
          path: ${{ runner.temp }}/mesure
      - run: |
          M="$RUNNER_TEMP/mesure"
          node scripts/couverture.mjs badge "$M/coverage-summary.json" > "$M/badge.svg"
          git fetch --depth=1 origin couverture && git checkout -qB couverture FETCH_HEAD             || { git checkout -q --orphan couverture && git rm -rfq .; }
          cp "$M/coverage-summary.json" "$M/badge.svg" .
          git add coverage-summary.json badge.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"             commit -qm "couverture de ${GITHUB_SHA::7}" || exit 0
          git push origin couverture

  migrations:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Une seule migration à la fois par base
    concurrency: migrations-${{ github.ref_name }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # develop → staging ZIK-DEV, master → prod
      PROJECT_REF: ${{ github.ref_name == 'master' && 'fbeubmwhxytniohodlgr' || 'ieuknbblonybkiqknonn' }}
    steps:
      - uses: actions/checkout@v4
      - run: npx -y supabase@3.0.0 link --project-ref "$PROJECT_REF"
      - run: npx -y supabase@3.0.0 db push --remote --dry-run
      - run: npx -y supabase@3.0.0 db push --remote --yes
