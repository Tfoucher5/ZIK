name: Prospection ZIK Pro

# Lancé du lundi au vendredi par la routine Claude « ZIK - Prospection » via
# workflow_dispatch (le cron GitHub sautait des jours) : lit les réponses reçues
# sur theo@zik-music.fr, puis envoie les mails du jour. La routine trie ensuite
# les réponses (Supabase).
# Dépôt public : les scripts n'écrivent que des compteurs dans les journaux.
on:
  workflow_dispatch:

concurrency: prospection

jobs:
  prospection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PROSPECT_MAIL_PASSWORD: ${{ secrets.PROSPECT_MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - name: Lire les réponses
        run: node scripts/prospection/inbox.mjs

      - name: Envoyer les mails du jour
        run: node scripts/prospection/send.mjs --send
