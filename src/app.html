<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png?v=20260402"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon/favicon.svg?v=20260402"
    />
    <link rel="shortcut icon" href="/favicon/favicon.ico?v=20260402" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png?v=20260402"
    />
    <link rel="manifest" href="/favicon/site.webmanifest?v=20260402" />

    <meta name="apple-mobile-web-app-title" content="Zik-Music.fr" />
    <meta
      name="theme-color"
      content="#080808"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <link rel="preconnect" href="https://e-cdns-images.dzcdn.net" crossorigin />
    <link rel="dns-prefetch" href="https://api.deezer.com" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/barlow-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/barlow-condensed-800-latin.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/fonts.css?v=3.0.0" />
    <link rel="stylesheet" href="/css/theme.css?v=3.0.0" />
    %sveltekit.head%
    <!-- Theme / animation preference (inline to avoid FOUC) -->
    <script>
      (function () {
        var t = localStorage.getItem("zik_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
        var bgs = {
          dark: "#080808",
          light: "#e8edf8",
          violet: "#0c0814",
          ocean: "#050b13",
          sunset: "#140806",
          emeraude: "#04100a",
        };
        if (bgs[t]) {
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach(function (m) {
              m.content = bgs[t];
            });
        }
        // Legacy: migrate zik_dark → zik_theme
        if (!localStorage.getItem("zik_theme")) {
          var d = localStorage.getItem("zik_dark");
          if (d === "false") {
            localStorage.setItem("zik_theme", "light");
            document.documentElement.setAttribute("data-theme", "light");
          }
        }
        if (localStorage.getItem("zik_animations") === "off") {
          document.documentElement.classList.add("no-animations");
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
