<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Barlow";
        font-weight: 600;
        src: url("FONTS/barlow-600-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 900;
        src: url("FONTS/barlow-condensed-900-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        src: url("FONTS/barlow-condensed-900i-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        src: url("FONTS/jetbrains-mono-700-latin.woff2") format("woff2");
      }
      :root {
        --acc: #ff1fd6;
        --acc2: #c026d3;
        --ink: #0b0612;
        --cy: #22e4ff;
        --yl: #ffe14d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      body {
        font-family: "Barlow", "Noto Color Emoji", sans-serif;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      #world {
        transform-origin: 540px 960px;
      }
      .pnl {
        position: absolute;
        overflow: hidden;
        background: #000;
      }
      .pnl img {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .pnl.card {
        border-radius: 40px;
        box-shadow:
          0 0 0 8px #fff,
          0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .dim {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #vig {
        background: radial-gradient(
          120% 80% at 50% 50%,
          transparent 55%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      .txt {
        position: absolute;
        left: 50px;
        right: 50px;
        text-align: center;
        font-family: "Barlow Condensed", "Noto Color Emoji", sans-serif;
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        line-height: 1;
        color: #fff;
      }
      .txt .w {
        display: inline-block;
        margin: 0 0.12em;
        -webkit-text-stroke: 0.16em #000;
        paint-order: stroke fill;
        text-shadow:
          0.05em 0.07em 0 #000,
          0 0 40px rgba(0, 0, 0, 0.35);
      }
      .txt .w.acc {
        color: var(--acc);
      }
      .txt .w.yl {
        color: var(--yl);
      }
      .txt .w.cy {
        color: var(--cy);
      }
      .txt.box .w {
        -webkit-text-stroke: 0;
        text-shadow: none;
        background: var(--acc);
        padding: 0.06em 0.16em 0;
        margin: 0.04em 0.06em;
        box-shadow: 0.08em 0.08em 0 #000;
      }
      .txt.box .w.ink {
        background: #000;
      }
      .txt.box .w.wh {
        background: #fff;
        color: #000;
      }
      .fx {
        position: absolute;
      }
      .count {
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        color: var(--yl);
        -webkit-text-stroke: 0.1em #000;
        paint-order: stroke fill;
        text-shadow: 0.06em 0.08em 0 #000;
        white-space: nowrap;
        text-align: center;
        transform-origin: 50% 50%;
      }
      .big {
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        color: #fff;
        -webkit-text-stroke: 0.05em #000;
        paint-order: stroke fill;
        text-shadow: 0.04em 0.05em 0 var(--acc);
        text-align: center;
        left: 0;
        right: 0;
        line-height: 1;
      }
      .stamp {
        font-family: "Barlow Condensed", "Noto Color Emoji";
        font-weight: 900;
        text-transform: uppercase;
        color: #fff;
        background: var(--acc);
        padding: 0.1em 0.35em 0.02em;
        box-shadow: 0.1em 0.1em 0 #000;
        white-space: nowrap;
        transform-origin: 50% 50%;
      }
      .stamp.ink {
        background: #000;
        box-shadow: 0.1em 0.1em 0 var(--acc);
      }
      .stamp.yl {
        background: var(--yl);
        color: #000;
      }
      .stamp.gr {
        background: #18d26e;
      }
      .emo {
        font-family: "Noto Color Emoji";
        line-height: 1;
        transform-origin: 50% 50%;
      }
      svg.ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .conf {
        position: absolute;
        width: 22px;
        height: 34px;
      }
      #outro {
        background: var(--acc2);
      }
      #outro .bgi {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0.15;
        filter: grayscale(1) contrast(1.4);
        mix-blend-mode: multiply;
      }
      #outro .bgi img {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #outro .logo {
        position: absolute;
        left: 0;
        right: 0;
        top: 520px;
        text-align: center;
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        font-size: 430px;
        line-height: 1;
        color: #fff;
        text-shadow: 14px 14px 0 #000;
      }
      #outro .logo b {
        color: #000;
        text-shadow: none;
      }
      #outro .l1 {
        position: absolute;
        left: 0;
        right: 0;
        top: 1010px;
        text-align: center;
      }
      #outro .l2 {
        position: absolute;
        left: 0;
        right: 0;
        top: 1190px;
        text-align: center;
      }
      #outro .l3 {
        position: absolute;
        left: 0;
        right: 0;
        top: 1390px;
        text-align: center;
        font-family: "JetBrains Mono";
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.25em;
        color: #fff;
        text-transform: uppercase;
      }
      #beat {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background: var(--acc);
        transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div id="world" class="layer"><div id="shots" class="layer"></div></div>
    <div id="vig" class="dim"></div>
    <div id="over" class="layer"></div>
    <div id="outro" class="layer" style="visibility: hidden">
      <div class="bgi"><img /></div>
      <div class="logo">ZIK<b>.</b></div>
      <div class="l1"></div>
      <div class="l2"></div>
      <div class="l3"></div>
    </div>
    <div id="flash" class="dim"></div>
    <div id="beat"></div>
    <script>
      const $ = (s, el = document) => el.querySelector(s);
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const eo = (x) => 1 - Math.pow(1 - x, 3);
      const snap = (x) => 1 - Math.pow(1 - x, 5);
      const eio = (x) =>
        x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      const back = (x, c1 = 2.2) => {
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      };
      const EASE = { io: eio, out: eo, snap, lin: (x) => x };
      const rnd = (i) => {
        const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const noise = (t, f, seed) =>
        Math.sin(t * f + seed) * 0.6 + Math.sin(t * f * 2.3 + seed * 3.1) * 0.4;
      const lerpKeys = (keys, t) => {
        if (!keys || !keys.length) return {};
        if (t <= keys[0].t) return keys[0];
        for (let i = 1; i < keys.length; i++)
          if (t <= keys[i].t) {
            const a = keys[i - 1],
              b = keys[i],
              k = (EASE[b.e] || eio)((t - a.t) / (b.t - a.t));
            const o = {};
            for (const key of ["s", "x", "y"])
              o[key] = (a[key] ?? 0) + ((b[key] ?? 0) - (a[key] ?? 0)) * k;
            return o;
          }
        return keys.at(-1);
      };
      let SPEC, RECS, DIR;
      const srcOf = (rec, f) => `${DIR}/${rec}/${f}`;
      function frameAt(rec, t) {
        const fr = RECS[rec].frames;
        let lo = 0,
          hi = fr.length - 1;
        if (t <= fr[0].t) return fr[0].f;
        while (lo < hi) {
          const m = (lo + hi + 1) >> 1;
          if (fr[m].t <= t) lo = m;
          else hi = m - 1;
        }
        return fr[lo].f;
      }
      async function place(img, rec, t, cam, W, H, extraS = 1, dx = 0, dy = 0) {
        const { w: fw, h: fh } = RECS[rec];
        const s = (cam.s ?? 1) * extraS * (W / fw);
        const hw = W / 2 / s,
          hh = H / 2 / s;
        const cx = clamp(
            cam.x ?? fw / 2,
            Math.min(hw, fw / 2),
            Math.max(fw - hw, fw / 2),
          ),
          cy = clamp(
            cam.y ?? fh / 2,
            Math.min(hh, fh / 2),
            Math.max(fh - hh, fh / 2),
          );
        img.style.width = fw + "px";
        img.style.height = fh + "px";
        img.style.transform = `translate(${W / 2 - cx * s + dx}px, ${H / 2 - cy * s + dy}px) scale(${s})`;
        const src = srcOf(rec, frameAt(rec, t));
        if (img.getAttribute("src") !== src) {
          img.src = src;
          await img.decode().catch(() => {});
        }
      }
      const wordsHtml = (str) => {
        let cur = null;
        return str
          .split(" ")
          .map((w) => {
            if (!cur && /^[*_~^]/.test(w)) {
              cur = w[0];
              w = w.slice(1);
            }
            const cls = cur
              ? { "*": "acc", _: "yl", "~": "cy", "^": "ink" }[cur]
              : "";
            if (cur && w.includes(cur)) {
              w = w.replace(cur, "");
              cur = null;
            }
            return `<span class="w ${cls}">${w}</span>`;
          })
          .join("");
      };
      function build(spec, recs, dir) {
        SPEC = spec;
        RECS = recs;
        DIR = dir;
        document.documentElement.style.setProperty("--fonts", "");
        for (const sh of spec.shots) {
          const el = document.createElement("div");
          el.className = "layer";
          sh.el = el;
          sh.panels = sh.panels || [
            {
              rec: sh.rec,
              from: sh.from,
              speed: sh.speed,
              cam: sh.cam,
              x: 0,
              y: 0,
              w: 1080,
              h: 1920,
            },
          ];
          for (const p of sh.panels) {
            const d = document.createElement("div");
            d.className = "pnl " + (p.card ? "card" : "");
            Object.assign(d.style, {
              left: p.x + "px",
              top: p.y + "px",
              width: p.w + "px",
              height: p.h + "px",
            });
            d.innerHTML = "<img>";
            p.el = d;
            el.appendChild(d);
          }
          if (sh.bg) el.style.background = sh.bg;
          el.style.visibility = "hidden";
          $("#shots").appendChild(el);
        }
        for (const tx of spec.texts || []) {
          const el = document.createElement("div");
          el.className = "txt " + (tx.box ? "box" : "");
          Object.assign(el.style, {
            top: tx.y + "px",
            fontSize: (tx.size || 130) + "px",
          });
          el.innerHTML = tx.t
            .split("|")
            .map((ln) => `<div>${wordsHtml(ln)}</div>`)
            .join("");
          tx.el = el;
          el.style.visibility = "hidden";
          $("#over").appendChild(el);
        }
        for (const f of spec.fx || []) {
          let el;
          if (f.type === "ring") {
            el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            el.setAttribute("class", "ring");
            el.innerHTML = `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="${f.rx ?? 30}" fill="none" stroke="${f.color || "#ffe14d"}" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100"/>`;
          } else if (f.type === "confetti") {
            el = document.createElement("div");
            el.className = "layer";
            const cols = ["#ff1fd6", "#ffe14d", "#22e4ff", "#18d26e", "#fff"];
            el.innerHTML = Array.from(
              { length: f.n || 70 },
              (_, i) =>
                `<div class="conf" style="background:${cols[i % cols.length]}"></div>`,
            ).join("");
          } else {
            el = document.createElement("div");
            el.className = "fx " + f.type + " " + (f.cls || "");
            el.innerHTML = f.type === "count" ? "" : f.text;
            Object.assign(el.style, { fontSize: (f.size || 120) + "px" });
            if (f.type === "big") el.style.top = f.y + "px";
            else Object.assign(el.style, { left: f.x + "px", top: f.y + "px" });
          }
          f.el = el;
          el.style.visibility = "hidden";
          $("#over").appendChild(el);
        }
        const o = spec.outro;
        $("#outro .l1").innerHTML =
          `<div class="txt" style="position:static;font-size:120px">${(
            o.l1 || "Joue *gratuit*"
          )
            .split("|")
            .map((l) => `<div>${wordsHtml(l)}</div>`)
            .join("")}</div>`;
        $("#outro .l2").innerHTML =
          `<div class="txt box" style="position:static;font-size:104px"><span class="w ink">zik-music.fr</span></div>`;
        $("#outro .l3").textContent = o.l3 || "Lien en bio · sans appli";
        const extra = ((o.l1 || "").split("|").length - 1) * 120;
        $("#outro .l2").style.top = 1190 + extra + "px";
        $("#outro .l3").style.top = 1390 + extra + "px";
        $("#outro .logo").style.top = 520 - extra / 2 + "px";
        $("#outro .l1").style.top = 1010 - extra / 2 + "px";
      }
      async function render(t) {
        const loads = [];
        const beat = 60 / (SPEC.bpm || 120);
        const bp = (t % beat) / beat;
        let shake = 0,
          punch = 0;
        for (const sh of SPEC.shots) {
          const vis = t >= sh.a - 1e-4 && t < sh.b;
          sh.el.style.visibility = vis ? "visible" : "hidden";
          if (!vis) continue;
          const lt = t - sh.a;
          const pin = sh.punch ?? 0.18;
          const ps = 1 + pin * (1 - snap(prog(lt, 0, 0.35)));
          let dx = 0,
            dy = 0,
            blur = 0;
          const wp = prog(lt, 0, sh.whipD ?? 0.16);
          if (sh.whip && wp < 1) {
            const d = (1 - snap(wp)) * 900;
            blur = (1 - wp) * 28;
            if (sh.whip === "up") dy = d;
            else if (sh.whip === "down") dy = -d;
            else if (sh.whip === "left") dx = d;
            else dx = -d;
          }
          sh.el.style.filter = blur > 0.5 ? `blur(${blur}px)` : "";
          shake = Math.max(shake, sh.shake ?? 0);
          if (sh.pulse) punch = Math.max(punch, sh.pulse);
          for (const p of sh.panels) {
            const pin2 =
              p.enter != null ? back(prog(lt, p.enter, p.enter + 0.35)) : 1;
            p.el.style.transform =
              p.enter != null
                ? `translateY(${(1 - pin2) * 1200}px) rotate(${p.rot ?? 0}deg)`
                : `rotate(${p.rot ?? 0}deg)`;
            const ft = (p.from ?? sh.from) + lt * (p.speed ?? sh.speed ?? 1);
            loads.push(
              place(
                $("img", p.el),
                p.rec ?? sh.rec,
                ft,
                lerpKeys(p.cam ?? sh.cam, lt),
                p.w,
                p.h,
                ps,
                dx,
                dy,
              ),
            );
          }
        }
        const sk = shake * 1;
        const zx = sk ? noise(t, 37, 1) * sk : 0,
          zy = sk ? noise(t, 41, 7) * sk : 0,
          zr = sk ? noise(t, 29, 3) * sk * 0.04 : 0;
        const pulse = 1 + punch * Math.pow(1 - bp, 4);
        $("#world").style.transform =
          `translate(${zx}px, ${zy}px) rotate(${zr}deg) scale(${pulse})`;
        let fl = 0;
        for (const sh of SPEC.shots)
          if (sh.flash !== false && sh.a > 0)
            fl = Math.max(
              fl,
              (1 - prog(t, sh.a, sh.a + 0.14)) *
                (t >= sh.a ? (sh.flash ?? 0.55) : 0),
            );
        for (const f of SPEC.fx || [])
          if (f.type === "flash" && t >= f.a)
            fl = Math.max(fl, 1 - prog(t, f.a, f.a + 0.2));
        if (SPEC.outro && t >= SPEC.outro.a)
          fl = Math.max(fl, 1 - prog(t, SPEC.outro.a, SPEC.outro.a + 0.18));
        $("#flash").style.opacity = fl;
        for (const tx of SPEC.texts || []) {
          const vis = t >= tx.a && t < tx.b;
          tx.el.style.visibility = vis ? "visible" : "hidden";
          if (!vis) continue;
          const lt = t - tx.a,
            per = tx.per ?? 0.09;
          const ex = prog(t, tx.b - 0.08, tx.b);
          [...tx.el.querySelectorAll(".w")].forEach((w, i) => {
            const p = prog(lt, i * per, i * per + 0.18);
            const s = p <= 0 ? 0 : 1 + (1 - back(p, 3)) * -0.9 + (1 - p) * 0.8;
            const wob = tx.wob ? Math.sin(t * 9 + i) * 2 : 0;
            w.style.opacity = p > 0 ? 1 : 0;
            w.style.transform = `scale(${s * (1 - ex)}) rotate(${(1 - p) * (i % 2 ? 8 : -8) + wob + (tx.rot ?? 0)}deg)`;
          });
          tx.el.style.transform = `scale(${1 + 0.035 * Math.pow(1 - bp, 3)})`;
        }
        for (const f of SPEC.fx || []) {
          if (f.type === "flash") continue;
          const b = f.b ?? SPEC.duration,
            vis = t >= f.a && t < b;
          f.el.style.visibility = vis ? "visible" : "hidden";
          if (!vis) continue;
          const lt = t - f.a,
            ex = prog(t, b - 0.12, b);
          if (f.type === "ring") {
            const r = $("rect", f.el);
            r.setAttribute(
              "stroke-dashoffset",
              100 - 100 * eo(prog(lt, 0, 0.35)),
            );
            f.el.style.opacity = 1 - ex;
            f.el.style.transform = `scale(${1 + 0.02 * Math.sin(t * 20)})`;
            f.el.style.transformOrigin = `${f.x + f.w / 2}px ${f.y + f.h / 2}px`;
          } else if (f.type === "confetti") {
            [...f.el.children].forEach((c, i) => {
              const ang = rnd(i) * Math.PI * 2,
                sp = 900 + rnd(i + 99) * 1500;
              const x = f.x + Math.cos(ang) * sp * lt,
                y = f.y + Math.sin(ang) * sp * lt * 0.8 + 1800 * lt * lt;
              c.style.transform = `translate(${x}px, ${y}px) rotate(${lt * 900 * (rnd(i + 7) - 0.5)}deg) scaleX(${Math.cos(lt * 14 + i)})`;
              c.style.opacity = 1 - prog(lt, 0.9, 1.4);
            });
          } else if (f.type === "count") {
            const p = eo(prog(lt, 0.05, f.dur ?? 0.6));
            f.el.textContent =
              (f.prefix || "") +
              Math.round(
                (f.from ?? 0) + (f.to - (f.from ?? 0)) * p,
              ).toLocaleString("fr-FR") +
              (f.suffix || "");
            const s =
              back(prog(lt, 0, 0.25), 3) *
              (1 +
                0.15 *
                  (1 - prog(lt, f.dur ?? 0.6, (f.dur ?? 0.6) + 0.2)) *
                  (p >= 1 ? 1 : 0));
            f.el.style.transform = `translate(-50%, -50%) rotate(${f.r ?? -6}deg) scale(${s * (1 - ex)})`;
          } else if (f.type === "big") {
            const p = prog(lt, 0, 0.2);
            f.el.style.transform = `scale(${(2.4 - 1.4 * snap(p)) * (1 - ex)})`;
            f.el.style.opacity = p > 0 ? 1 : 0;
          } else {
            const p = back(prog(lt, 0, 0.22), 3.2);
            const wig = f.wig ? Math.sin(t * 16) * 3 : 0;
            f.el.style.transform = `translate(-50%, -50%) rotate(${(f.r ?? -6) + wig}deg) scale(${(f.type === "stamp" ? 2.2 - 1.2 * p : p) * (1 - ex)})`;
            f.el.style.opacity = clamp(lt / 0.06);
          }
        }
        const o = SPEC.outro,
          oel = $("#outro");
        if (o && t >= o.a) {
          const lt = t - o.a;
          oel.style.visibility = "visible";
          oel.style.clipPath = `inset(${(1 - snap(prog(lt, 0, 0.22))) * 100}% 0 0 0)`;
          const bgi = $(".bgi img", oel);
          loads.push(
            place(
              bgi,
              o.rec,
              o.from + lt,
              { s: o.s ?? 1.3, x: o.x, y: o.y },
              1080,
              1920,
            ),
          );
          const lg = $(".logo", oel),
            lp = prog(lt, 0.12, 0.32);
          lg.style.transform = `scale(${3 - 2 * snap(lp)}) rotate(${(1 - lp) * -8}deg)`;
          lg.style.opacity = lp > 0 ? 1 : 0;
          const sh2 = (1 - prog(lt, 0.32, 0.7)) * 18 * (lt > 0.32 ? 1 : 0);
          oel.style.transform = `translate(${noise(t, 47, 2) * sh2}px, ${noise(t, 53, 5) * sh2}px)`;
          [
            [".l1", 0.45],
            [".l2", 0.7],
            [".l3", 0.95],
          ].forEach(([q, a]) => {
            const p = back(prog(lt, a, a + 0.25), 3);
            const e = $(q, oel);
            e.style.opacity = p > 0 ? 1 : 0;
            e.style.transform = `scale(${p}) rotate(${(1 - p) * 6}deg)`;
          });
          $(".l2", oel).style.transform +=
            ` scale(${1 + 0.06 * Math.pow(1 - bp, 3) * (lt > 1 ? 1 : 0)})`;
        } else oel.style.visibility = "hidden";
        $("#beat").style.transform = `scaleX(${t / SPEC.duration})`;
        await Promise.all(loads);
      }
      window.build = build;
      window.render = render;
    </script>
  </body>
</html>
