<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Barlow";
        font-weight: 500;
        src: url("FONTS/barlow-500-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 600;
        src: url("FONTS/barlow-600-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 900;
        src: url("FONTS/barlow-condensed-900-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        src: url("FONTS/barlow-condensed-900i-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        src: url("FONTS/jetbrains-mono-700-latin.woff2") format("woff2");
      }
      :root {
        --acc: #e11ad0;
        --acc2: #c026d3;
        --ink: #0f0a19;
        --yl: #ffe14d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f7f5fa;
      }
      body {
        font-family: "Barlow", "Noto Color Emoji", sans-serif;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .pnl {
        position: absolute;
        overflow: hidden;
        background: #000;
      }
      .pnl img {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .pnl.phone {
        border-radius: 44px;
        box-shadow:
          0 0 0 10px #0f0a19,
          0 0 0 12px #3b3150,
          0 30px 70px rgba(15, 10, 25, 0.45);
      }
      .pnl.tv {
        border-radius: 14px;
        box-shadow:
          0 0 0 12px #0f0a19,
          0 30px 70px rgba(15, 10, 25, 0.45);
      }
      .bgGrid {
        background: #f1edf6;
        background-image:
          linear-gradient(rgba(15, 10, 25, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 10, 25, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .bgDark {
        background: radial-gradient(70% 50% at 50% 55%, #3a1747, #0f0a19 75%);
      }
      .cap {
        position: absolute;
        left: 50px;
        right: 50px;
        background: rgba(15, 10, 25, 0.94);
        border-radius: 30px;
        padding: 30px 40px 34px;
        box-shadow: 0 20px 60px rgba(15, 10, 25, 0.35);
        text-align: left;
      }
      .cap .k {
        font-family: "JetBrains Mono";
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--acc);
        margin-bottom: 10px;
      }
      .cap .h {
        font-family: "Barlow Condensed", "Noto Color Emoji";
        font-weight: 900;
        text-transform: uppercase;
        font-size: 88px;
        line-height: 0.95;
        color: #fff;
      }
      .cap .h .w {
        display: inline-block;
        margin-right: 0.2em;
      }
      .cap .h .w.acc {
        color: var(--acc);
      }
      .cap .s {
        margin-top: 14px;
        font-size: 40px;
        line-height: 1.22;
        font-weight: 500;
        color: #d6d0e0;
      }
      svg.ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .stamp {
        position: absolute;
        font-family: "Barlow Condensed", "Noto Color Emoji";
        font-weight: 900;
        text-transform: uppercase;
        color: #fff;
        background: var(--acc);
        padding: 0.1em 0.35em 0.02em;
        box-shadow: 0.08em 0.08em 0 #0f0a19;
        white-space: nowrap;
        transform-origin: 50% 50%;
      }
      .stamp.gr {
        background: #16b862;
      }
      .stamp.yl {
        background: var(--yl);
        color: #0f0a19;
      }
      .stamp.ink {
        background: #0f0a19;
        box-shadow: 0.08em 0.08em 0 var(--acc);
      }
      .stamp.num {
        width: 1.5em;
        height: 1.5em;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .veil {
        position: absolute;
        border-radius: 12px;
      }
      .mask {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1b1426;
        color: #fff;
        border-radius: 18px;
        font-family: "Barlow Condensed";
        font-weight: 900;
      }
      .count {
        position: absolute;
        font-family: "Barlow Condensed";
        font-weight: 900;
        color: #fff;
        background: #16b862;
        padding: 0.06em 0.3em 0;
        box-shadow: 0.06em 0.06em 0 #0f0a19;
        white-space: nowrap;
        transform-origin: 50% 50%;
      }
      .conf {
        position: absolute;
        width: 18px;
        height: 28px;
      }
      #outro {
        background: var(--acc2);
        visibility: hidden;
      }
      #outro .logo {
        position: absolute;
        left: 0;
        right: 0;
        top: 470px;
        text-align: center;
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        font-size: 400px;
        line-height: 1;
        color: #fff;
        text-shadow: 12px 12px 0 #0f0a19;
      }
      #outro .logo b {
        color: #0f0a19;
        text-shadow: none;
      }
      #outro .l1 {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 950px;
        text-align: center;
        font-family: "Barlow Condensed";
        font-weight: 900;
        text-transform: uppercase;
        font-size: 100px;
        line-height: 0.95;
        color: #fff;
      }
      #outro .l1 .acc {
        color: #0f0a19;
      }
      #outro .l1 .w {
        display: inline-block;
        margin: 0 0.12em;
      }
      #outro .l2 {
        position: absolute;
        left: 0;
        right: 0;
        top: 1220px;
        text-align: center;
      }
      #outro .l2 span {
        display: inline-block;
        background: #0f0a19;
        color: #fff;
        font-family: "Barlow Condensed";
        font-weight: 900;
        text-transform: uppercase;
        font-size: 96px;
        padding: 14px 44px 8px;
      }
      #outro .l3 {
        position: absolute;
        left: 0;
        right: 0;
        top: 1420px;
        text-align: center;
        font-family: "JetBrains Mono";
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.2em;
        color: #fff;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="shots" class="layer"></div>
    <div id="over" class="layer"></div>
    <div id="outro" class="layer">
      <div class="logo">ZIK<b>.</b></div>
      <div class="l1"></div>
      <div class="l2"><span>zik-music.fr</span></div>
      <div class="l3"></div>
    </div>
    <script>
      const $ = (s, el = document) => el.querySelector(s);
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const eo = (x) => 1 - Math.pow(1 - x, 3);
      const eio = (x) =>
        x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      const back = (x, c1 = 1.8) => {
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      };
      const EASE = { io: eio, out: eo, lin: (x) => x };
      const rnd = (i) => {
        const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const lerpKeys = (keys, t) => {
        if (!keys || !keys.length) return {};
        if (t <= keys[0].t) return keys[0];
        for (let i = 1; i < keys.length; i++)
          if (t <= keys[i].t) {
            const a = keys[i - 1],
              b = keys[i],
              k = (EASE[b.e] || eio)((t - a.t) / (b.t - a.t));
            const o = {};
            for (const key of ["s", "x", "y"])
              o[key] = a[key] + (b[key] - a[key]) * k;
            return o;
          }
        return keys.at(-1);
      };
      let SPEC, RECS, DIR;
      function frameAt(rec, t) {
        const fr = RECS[rec].frames;
        let lo = 0,
          hi = fr.length - 1;
        if (t <= fr[0].t) return fr[0].f;
        while (lo < hi) {
          const m = (lo + hi + 1) >> 1;
          if (fr[m].t <= t) lo = m;
          else hi = m - 1;
        }
        return fr[lo].f;
      }
      async function place(img, rec, t, cam, W, H) {
        const { w: fw, h: fh } = RECS[rec];
        const s = (cam.s ?? 1) * (W / fw);
        const hw = W / 2 / s,
          hh = H / 2 / s;
        const cx = clamp(
          cam.x ?? fw / 2,
          Math.min(hw, fw / 2),
          Math.max(fw - hw, fw / 2),
        );
        const cy = clamp(
          cam.y ?? fh / 2,
          Math.min(hh, fh / 2),
          Math.max(fh - hh, fh / 2),
        );
        img.style.width = fw + "px";
        img.style.height = fh + "px";
        img.style.transform = `translate(${W / 2 - cx * s}px, ${H / 2 - cy * s}px) scale(${s})`;
        const src = `${DIR}/${rec}/${frameAt(rec, t)}`;
        if (img.getAttribute("src") !== src) {
          img.src = src;
          await img.decode().catch(() => {});
        }
      }
      const words = (str) => {
        let on = false;
        return str
          .split(" ")
          .map((w) => {
            if (w.startsWith("*")) {
              on = true;
              w = w.slice(1);
            }
            const cls = on ? "acc" : "";
            if (w.includes("*")) {
              on = false;
              w = w.replace("*", "");
            }
            return `<span class="w ${cls}">${w}</span>`;
          })
          .join("");
      };
      function build(spec, recs, dir) {
        SPEC = spec;
        RECS = recs;
        DIR = dir;
        for (const sh of spec.shots) {
          const el = document.createElement("div");
          el.className =
            "layer " +
            (sh.bg === "dark" ? "bgDark" : sh.bg === "grid" ? "bgGrid" : "");
          sh.el = el;
          sh.panels = sh.panels || [
            {
              rec: sh.rec,
              from: sh.from,
              speed: sh.speed,
              cam: sh.cam,
              x: 0,
              y: 0,
              w: 1080,
              h: 1920,
            },
          ];
          for (const p of sh.panels) {
            const d = document.createElement("div");
            d.className = "pnl " + (p.kind || "");
            Object.assign(d.style, {
              left: p.x + "px",
              top: p.y + "px",
              width: p.w + "px",
              height: p.h + "px",
            });
            d.innerHTML = "<img>";
            p.el = d;
            el.appendChild(d);
          }
          el.style.visibility = "hidden";
          $("#shots").appendChild(el);
        }
        for (const c of spec.caps || []) {
          const el = document.createElement("div");
          el.className = "cap";
          el.style.top = c.y + "px";
          el.innerHTML =
            (c.k ? `<div class="k">${c.k}</div>` : "") +
            `<div class="h">${c.t
              .split("|")
              .map((l) => `<div>${words(l)}</div>`)
              .join("")}</div>` +
            (c.s ? `<div class="s">${c.s}</div>` : "");
          if (c.size) $(".h", el).style.fontSize = c.size + "px";
          c.el = el;
          el.style.visibility = "hidden";
          $("#over").appendChild(el);
        }
        for (const f of spec.fx || []) {
          let el;
          if (f.type === "ring") {
            el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            el.setAttribute("class", "ring");
            el.innerHTML = `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="${f.rx ?? 22}" fill="none" stroke="${f.color || "#e11ad0"}" stroke-width="10" pathLength="100" stroke-dasharray="100 100"/>`;
          } else if (f.type === "veil" || f.type === "mask") {
            el = document.createElement("div");
            el.className = f.type;
            Object.assign(el.style, {
              left: f.x + "px",
              top: f.y + "px",
              width: f.w + "px",
              height: f.h + "px",
              fontSize: (f.size || 80) + "px",
            });
            if (f.text) el.textContent = f.text;
          } else if (f.type === "confetti") {
            el = document.createElement("div");
            el.className = "layer";
            const cols = ["#e11ad0", "#ffe14d", "#22c5ee", "#16b862", "#fff"];
            el.innerHTML = Array.from(
              { length: 60 },
              (_, i) =>
                `<div class="conf" style="background:${cols[i % 5]}"></div>`,
            ).join("");
          } else {
            el = document.createElement("div");
            el.className = f.type + " " + (f.cls || "");
            if (f.type !== "count") el.innerHTML = f.text;
            Object.assign(el.style, {
              left: f.x + "px",
              top: f.y + "px",
              fontSize: (f.size || 90) + "px",
            });
          }
          f.el = el;
          el.style.visibility = "hidden";
          if (f.type === "veil") $("#over").prepend(el);
          else $("#over").appendChild(el);
        }
        const o = spec.outro;
        $("#outro .l1").innerHTML = (o.l1 || "Joue *gratuitement*")
          .split("|")
          .map((l) => `<div>${words(l)}</div>`)
          .join("");
        $("#outro .l3").textContent = o.l3 || "Sans appli · sans inscription";
      }
      async function render(t) {
        const loads = [];
        SPEC.shots.forEach((sh, i) => {
          const n = SPEC.shots[i + 1];
          sh.hold =
            n && n.slide !== false && Math.abs(n.a - sh.b) < 1e-3 ? 0.35 : 0;
        });
        for (const sh of SPEC.shots) {
          const vis = t >= sh.a - 1e-4 && t < sh.b + sh.hold;
          sh.el.style.visibility = vis ? "visible" : "hidden";
          if (!vis) continue;
          const lt = t - sh.a;
          const tin = sh.a === 0 ? 1 : eo(prog(lt, 0, 0.35));
          sh.el.style.transform =
            sh.slide === false ? "" : `translateX(${(1 - tin) * 1080}px)`;
          for (const p of sh.panels) {
            const pin =
              p.enter != null ? back(prog(lt, p.enter, p.enter + 0.45)) : 1;
            p.el.style.transform = `translateY(${(1 - pin) * 1400}px)`;
            const ft = (p.from ?? sh.from) + lt * (p.speed ?? sh.speed ?? 1);
            loads.push(
              place(
                $("img", p.el),
                p.rec ?? sh.rec,
                ft,
                lerpKeys(p.cam ?? sh.cam ?? [{ t: 0, s: 1 }], lt),
                p.w,
                p.h,
              ),
            );
          }
        }
        for (const c of SPEC.caps || []) {
          const vis = t >= c.a && t < c.b;
          c.el.style.visibility = vis ? "visible" : "hidden";
          if (!vis) continue;
          const lt = t - c.a,
            p = eo(prog(lt, 0, 0.3)),
            ex = prog(t, c.b - 0.2, c.b);
          c.el.style.opacity = p * (1 - ex);
          c.el.style.transform = `translateY(${(1 - p) * -30}px)`;
          [...c.el.querySelectorAll(".w")].forEach((w, i) => {
            const q = back(prog(lt, 0.1 + i * 0.05, 0.35 + i * 0.05));
            w.style.opacity = clamp(q * 2);
            w.style.transform = `translateY(${(1 - q) * 30}px)`;
          });
          const s = $(".s", c.el);
          if (s) s.style.opacity = eo(prog(lt, 0.35, 0.7));
        }
        for (const f of SPEC.fx || []) {
          const vis = t >= f.a && t < f.b;
          f.el.style.visibility = vis ? "visible" : "hidden";
          if (!vis) continue;
          const lt = t - f.a,
            ex = prog(t, f.b - 0.15, f.b);
          if (f.type === "ring") {
            $("rect", f.el).setAttribute(
              "stroke-dashoffset",
              100 - 100 * eo(prog(lt, 0, 0.5)),
            );
            f.el.style.opacity = 1 - ex;
          } else if (f.type === "veil") {
            const px =
              f.b0 + (f.b1 - f.b0) * eio(prog(lt, 0, f.d ?? f.b - f.a));
            f.el.style.backdropFilter = `blur(${px}px)`;
          } else if (f.type === "mask") {
            f.el.style.opacity = 1 - ex;
          } else if (f.type === "confetti") {
            [...f.el.children].forEach((c, i) => {
              const ang = rnd(i) * Math.PI * 2,
                sp = 700 + rnd(i + 99) * 1100;
              c.style.transform = `translate(${f.x + Math.cos(ang) * sp * lt}px, ${f.y + Math.sin(ang) * sp * lt * 0.8 + 1600 * lt * lt}px) rotate(${lt * 800 * (rnd(i + 7) - 0.5)}deg)`;
              c.style.opacity = 1 - prog(lt, 0.8, 1.3);
            });
          } else {
            if (f.type === "count") {
              const p = eo(prog(lt, 0.05, 0.6));
              f.el.textContent =
                (f.prefix || "") +
                Math.round(
                  (f.from ?? 0) + (f.to - (f.from ?? 0)) * p,
                ).toLocaleString("fr-FR") +
                (f.suffix || "");
            }
            const p = back(prog(lt, 0, 0.3), 2.4);
            f.el.style.transform = `translate(-50%, -50%) rotate(${f.r ?? -4}deg) scale(${p * (1 - ex)})`;
          }
        }
        const o = SPEC.outro,
          oel = $("#outro");
        if (t >= o.a) {
          const lt = t - o.a;
          oel.style.visibility = "visible";
          oel.style.clipPath = `circle(${eio(prog(lt, 0, 0.5)) * 1300}px at 50% 50%)`;
          const lg = $(".logo", oel),
            lp = back(prog(lt, 0.25, 0.7));
          lg.style.transform = `scale(${0.5 + 0.5 * lp})`;
          lg.style.opacity = clamp(lp * 1.5);
          [
            [".l1", 0.6],
            [".l2", 0.85],
            [".l3", 1.1],
          ].forEach(([q, a]) => {
            const p = back(prog(lt, a, a + 0.4));
            const e = $(q, oel);
            e.style.opacity = clamp(p);
            e.style.transform = `translateY(${(1 - p) * 40}px)`;
          });
        } else oel.style.visibility = "hidden";
        await Promise.all(loads);
      }
      window.build = build;
      window.render = render;
    </script>
  </body>
</html>
