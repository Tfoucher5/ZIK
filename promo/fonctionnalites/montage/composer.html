<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Barlow";
        font-weight: 500;
        src: url("../../../static/fonts/barlow-500-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 600;
        src: url("../../../static/fonts/barlow-600-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 500;
        src: url("../../../static/fonts/barlow-500-latin-ext.woff2")
          format("woff2");
        unicode-range: U+0100-024F;
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        src: url("../../../static/fonts/barlow-condensed-800-latin.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 900;
        src: url("../../../static/fonts/barlow-condensed-900-latin.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        src: url("../../../static/fonts/barlow-condensed-900i-latin.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        src: url("../../../static/fonts/jetbrains-mono-700-latin.woff2")
          format("woff2");
      }
      :root {
        --bg: #f7f5fa;
        --bg2: #ece8f2;
        --ink: #0f172a;
        --acc: #c026d3;
        --acc2: #a21caf;
        --mid: #64748b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Barlow", sans-serif;
        color: var(--ink);
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .cond {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #bgGrid {
        background-image:
          linear-gradient(rgba(15, 23, 42, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      #bgGlow {
        background: radial-gradient(
          55% 35% at 50% 62%,
          rgba(192, 38, 211, 0.2),
          transparent 70%
        );
      }
      /* Légende (zone sûre TikTok : x 60-900, y 150-520) */
      .cap {
        position: absolute;
        left: 70px;
        right: 150px;
        top: 150px;
      }
      .cap .kick {
        display: inline-block;
        color: #fff;
        background: var(--acc);
        font-size: 26px;
        padding: 10px 16px 8px;
        margin-bottom: 18px;
      }
      .cap h2 {
        font-size: 104px;
        line-height: 0.9;
      }
      .cap h2 em {
        font-style: normal;
        color: var(--acc);
      }
      .cap p {
        margin-top: 18px;
        font-size: 38px;
        line-height: 1.22;
        color: #334155;
        font-weight: 500;
      }
      /* Cadre de l'écran */
      .dev {
        position: absolute;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 40px 120px rgba(15, 23, 42, 0.28),
          0 0 0 3px #0f172a;
      }
      .dev img {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .dev.phone {
        border-radius: 56px;
        box-shadow:
          0 40px 120px rgba(15, 23, 42, 0.3),
          0 0 0 14px #0f172a,
          0 0 0 16px #334155;
      }
      .dev.tv {
        border-radius: 18px;
        box-shadow:
          0 40px 120px rgba(15, 23, 42, 0.3),
          0 0 0 16px #0f172a;
      }
      .sticker {
        position: absolute;
        z-index: 5;
        background: var(--acc);
        color: #fff;
        font-family: "Barlow Condensed";
        font-weight: 900;
        text-transform: uppercase;
        padding: 14px 26px 10px;
        font-size: 56px;
        box-shadow: 8px 8px 0 #0f172a;
        white-space: nowrap;
      }
      .sticker.ink {
        background: #0f172a;
        box-shadow: 8px 8px 0 var(--acc);
      }
      /* Accroche */
      .hook {
        position: absolute;
        left: 70px;
        right: 90px;
        top: 520px;
      }
      .hook .l {
        display: block;
        font-size: 148px;
        line-height: 0.88;
      }
      .hook .l.acc {
        color: var(--acc);
      }
      .hook .l.out {
        color: transparent;
        -webkit-text-stroke: 4px var(--ink);
      }
      .hookBg {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .hookBg img {
        position: absolute;
        filter: blur(3px) saturate(1.1);
        opacity: 0.16;
      }
      /* Fin */
      .outro {
        background: var(--acc);
      }
      .outro .logo {
        position: absolute;
        left: 0;
        right: 0;
        top: 560px;
        text-align: center;
        font-family: "Barlow Condensed";
        font-weight: 900;
        font-style: italic;
        font-size: 400px;
        line-height: 1;
        color: #fff;
      }
      .outro .logo b {
        color: #0f172a;
      }
      .outro .t1 {
        position: absolute;
        left: 0;
        right: 0;
        top: 1000px;
        text-align: center;
        color: #fff;
        font-size: 30px;
      }
      .outro .t2 {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1080px;
        text-align: center;
        color: #0f172a;
        font-size: 92px;
        line-height: 0.95;
      }
      .outro .t3 {
        position: absolute;
        left: 0;
        right: 0;
        top: 1330px;
        text-align: center;
      }
      .outro .t3 span {
        display: inline-block;
        background: #0f172a;
        color: #fff;
        font-size: 76px;
        padding: 18px 52px 12px;
      }
    </style>
  </head>
  <body>
    <div id="stage" class="layer">
      <div id="bgGrid" class="layer"></div>
      <div id="bgGlow" class="layer"></div>
    </div>
    <script>
      const $ = (s, el = document) => el.querySelector(s);
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const eo = (x) => 1 - Math.pow(1 - x, 3);
      const eio = (x) =>
        x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      const back = (x) => {
        const c1 = 1.70158,
          c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      };
      const lerpKeys = (keys, t) => {
        if (!keys || !keys.length) return null;
        if (t <= keys[0].t) return keys[0];
        for (let i = 1; i < keys.length; i++)
          if (t <= keys[i].t) {
            const a = keys[i - 1],
              b = keys[i],
              k = eio((t - a.t) / (b.t - a.t));
            const o = { t };
            for (const key of Object.keys(b))
              if (key !== "t") o[key] = a[key] + (b[key] - a[key]) * k;
            return o;
          }
        return keys.at(-1);
      };
      const stage = $("#stage");
      let SPEC,
        RECS = {};
      function frameAt(rec, t) {
        const fr = RECS[rec].frames;
        let lo = 0,
          hi = fr.length - 1;
        if (t <= fr[0].t) return fr[0].f;
        while (lo < hi) {
          const m = (lo + hi + 1) >> 1;
          if (fr[m].t <= t) lo = m;
          else hi = m - 1;
        }
        return fr[lo].f;
      }
      let REC_DIR = "";
      const srcOf = (rec, f) => `${REC_DIR}/${rec}/${f}`;
      function build(spec, recs, recDir) {
        REC_DIR = recDir;
        SPEC = spec;
        RECS = recs;
        for (const sc of spec.scenes) {
          const el = document.createElement("div");
          el.className = "layer";
          sc.el = el;
          if (sc.type === "hook") {
            el.innerHTML =
              (sc.bg ? `<div class="hookBg"><img></div>` : "") +
              `<div class="hook cond">${sc.lines.map(([txt, cls]) => `<span class="l ${cls || ""}">${txt}</span>`).join("")}</div>` +
              (sc.sticker
                ? `<div class="sticker" style="left:${sc.sticker.x}px;top:${sc.sticker.y}px;transform:rotate(${sc.sticker.r || -4}deg)">${sc.sticker.text}</div>`
                : "");
          } else if (sc.type === "clip") {
            const d = sc.dev;
            el.innerHTML =
              `<div class="dev ${d.kind || ""}" style="left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px"><img></div>` +
              (sc.cap
                ? `<div class="cap">${sc.cap.kick ? `<div class="kick mono">${sc.cap.kick}</div><br>` : ""}<h2 class="cond">${sc.cap.title}</h2>${sc.cap.sub ? `<p>${sc.cap.sub}</p>` : ""}</div>`
                : "") +
              (sc.stickers || [])
                .map(
                  (s) =>
                    `<div class="sticker ${s.ink ? "ink" : ""}" data-a="${s.a}" data-b="${s.b ?? 999}" style="left:${s.x}px;top:${s.y}px;--r:${s.r ?? -4}deg">${s.text}</div>`,
                )
                .join("");
            if (sc.extra)
              for (const x of sc.extra) {
                const dv = document.createElement("div");
                dv.className = `dev ${x.kind || ""}`;
                Object.assign(dv.style, {
                  left: x.x + "px",
                  top: x.y + "px",
                  width: x.w + "px",
                  height: x.h + "px",
                });
                dv.innerHTML = "<img>";
                x.el = dv;
                el.appendChild(dv);
              }
          } else if (sc.type === "outro") {
            el.className = "layer outro";
            el.innerHTML = `<div class="logo">ZIK<b>.</b></div><div class="t1 mono">${sc.kick || "Blind test multijoueur"}</div><div class="t2 cond">${sc.line || "Gratuit · sans appli"}</div><div class="t3 cond"><span>zik-music.fr</span></div>`;
          }
          el.style.visibility = "hidden";
          stage.appendChild(el);
        }
      }
      async function placeShot(box, img, rec, t, cam, W, H) {
        const meta = RECS[rec];
        const fw = meta.w,
          fh = meta.h;
        const c = cam || {};
        const s = (c.s ?? 1) * (W / fw);
        const cx = c.x ?? fw / 2,
          cy = c.y ?? H / 2 / (W / fw) / (c.s ?? 1);
        const tx = W / 2 - cx * s,
          ty = H / 2 - cy * s;
        img.style.width = fw + "px";
        img.style.height = fh + "px";
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
        const src = srcOf(rec, frameAt(rec, t));
        if (img.getAttribute("src") !== src) {
          img.src = src;
          await img.decode().catch(() => {});
        }
      }
      async function render(t) {
        const loads = [];
        for (const sc of SPEC.scenes) {
          const fi = sc.fi ?? 0.35,
            fo = sc.fo ?? 0.3;
          const vis = t >= sc.a - 0.001 && t < sc.b;
          sc.el.style.visibility = vis ? "visible" : "hidden";
          if (!vis) continue;
          const lt = t - sc.a,
            dur = sc.b - sc.a;
          const op = Math.min(
            sc.a === 0 ? 1 : eo(prog(lt, 0, fi)),
            sc.b >= SPEC.duration ? 1 : 1 - prog(lt, dur - fo, dur),
          );
          sc.el.style.opacity = op;
          if (sc.type === "hook") {
            [...sc.el.querySelectorAll(".l")].forEach((l, k) => {
              const p = back(prog(lt, 0.1 + k * 0.22, 0.5 + k * 0.22));
              l.style.transform = `translateY(${(1 - p) * 110}px)`;
              l.style.opacity = clamp(p);
            });
            const st = $(".sticker", sc.el);
            if (st) {
              const p = back(
                prog(lt, sc.sticker.at ?? 1.2, (sc.sticker.at ?? 1.2) + 0.35),
              );
              st.style.transform = `rotate(${sc.sticker.r ?? -4}deg) scale(${p})`;
              st.style.opacity = clamp(p * 2);
            }
            if (sc.bg) {
              const img = $(".hookBg img", sc.el),
                meta = RECS[sc.bg.rec];
              const s = (1080 / meta.w) * 1.15;
              img.style.width = meta.w * s + "px";
              img.style.left = (1080 - meta.w * s) / 2 + "px";
              img.style.top = -80 - lt * 30 + "px";
              loads.push(
                (async () => {
                  const src = srcOf(
                    sc.bg.rec,
                    frameAt(sc.bg.rec, sc.bg.t + lt),
                  );
                  if (img.getAttribute("src") !== src) {
                    img.src = src;
                    await img.decode().catch(() => {});
                  }
                })(),
              );
            }
          } else if (sc.type === "clip") {
            const d = sc.dev,
              box = $(".dev", sc.el),
              img = $("img", box);
            const ft = sc.from + lt * (sc.speed ?? 1);
            const enter = sc.enter === false ? 1 : back(prog(lt, 0, 0.6));
            box.style.transform = `translateY(${(1 - enter) * 700}px)`;
            loads.push(
              placeShot(box, img, sc.rec, ft, lerpKeys(sc.cam, lt), d.w, d.h),
            );
            for (const x of sc.extra || []) {
              const p = back(prog(lt, x.at ?? 0, (x.at ?? 0) + 0.5));
              x.el.style.transform = `translateY(${(1 - p) * 900}px) rotate(${x.r ?? 0}deg)`;
              loads.push(
                placeShot(
                  x.el,
                  $("img", x.el),
                  x.rec,
                  x.from + lt * (x.speed ?? 1),
                  lerpKeys(x.cam, lt),
                  x.w,
                  x.h,
                ),
              );
            }
            const cap = $(".cap", sc.el);
            if (cap) {
              const p = eo(prog(lt, 0.05, 0.55));
              cap.style.transform = `translateY(${(1 - p) * 40}px)`;
              cap.style.opacity = p;
            }
            [...sc.el.querySelectorAll(".sticker")].forEach((s) => {
              const a = +s.dataset.a,
                b = +s.dataset.b;
              const p =
                back(prog(lt, a, a + 0.35)) * (1 - prog(lt, b - 0.2, b));
              s.style.opacity = clamp(p * 2);
              s.style.transform = `rotate(${getComputedStyle(s).getPropertyValue("--r")}) scale(${Math.max(0, p)})`;
            });
          } else if (sc.type === "outro") {
            const r = eio(prog(lt, 0, 0.5)) * 1400;
            sc.el.style.clipPath = `circle(${r}px at 50% 45%)`;
            sc.el.style.opacity = 1;
            const lp = back(prog(lt, 0.3, 0.8));
            const lg = $(".logo", sc.el);
            lg.style.transform = `scale(${0.4 + 0.6 * lp})`;
            lg.style.opacity = clamp(lp * 1.4);
            [".t1", ".t2", ".t3"].forEach((q, k) => {
              const p = back(prog(lt, 0.75 + k * 0.22, 1.15 + k * 0.22));
              const e = $(q, sc.el);
              e.style.opacity = clamp(p);
              e.style.transform = `translateY(${(1 - p) * 50}px)`;
            });
          }
        }
        $("#bgGlow").style.opacity = 0.75 + 0.25 * Math.sin(t * 1.3);
        await Promise.all(loads);
      }
      window.build = build;
      window.render = render;
    </script>
  </body>
</html>
